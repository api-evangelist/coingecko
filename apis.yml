description: >-
  CoinGecko is a cryptocurrency data aggregator providing market data, analytics, and information on thousands of crypto
  assets, exchanges, derivatives, NFTs, and on-chain decentralized markets worldwide. The CoinGecko Developer Platform
  exposes three primary APIs: the public Crypto Market Data API (Demo plan and free tier), the commercial Pro API for
  higher rate limits and exclusive endpoints, and the Onchain DEX API powered by GeckoTerminal for decentralized
  exchange data across 250+ networks. Authentication uses x-cg-demo-api-key (Demo) or x-cg-pro-api-key (Pro) headers,
  with rate limits ranging from 30 calls per minute on Demo to 1,000 calls per minute on top Pro tiers.
