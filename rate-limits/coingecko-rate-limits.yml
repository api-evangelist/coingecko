specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: CoinGecko
providerId: coingecko
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Rate Limiting
  - Cryptocurrency
  - Market Data
description: CoinGecko enforces both a per-minute rate limit and a monthly call-credit quota that vary
  by subscription plan. Demo (public) is approximately 30 calls/minute and varies with traffic. Pro plans
  define explicit per-minute ceilings and monthly credits. Every API request, success or failure, counts
  against the quota.
sources:
  - https://www.coingecko.com/en/api/pricing
  - https://docs.coingecko.com/v3.0.1/reference/common-errors-rate-limit
responseCodes:
  throttled: 429
limits:
  - name: Demo plan
    scope: key
    metric: requests_per_minute
    limit: 30
    timeFrame: minute
    notes: Approximate; varies with overall traffic.
  - name: Demo monthly credits
    scope: key
    metric: requests_per_month
    limit: 10000
    timeFrame: month
  - name: Basic plan
    scope: key
    metric: requests_per_minute
    limit: 250
    timeFrame: minute
  - name: Basic monthly credits
    scope: key
    metric: requests_per_month
    limit: 100000
    timeFrame: month
  - name: Analyst plan
    scope: key
    metric: requests_per_minute
    limit: 500
    timeFrame: minute
  - name: Analyst monthly credits
    scope: key
    metric: requests_per_month
    limit: 500000
    timeFrame: month
  - name: Lite plan
    scope: key
    metric: requests_per_minute
    limit: 500
    timeFrame: minute
  - name: Lite monthly credits
    scope: key
    metric: requests_per_month
    limit: 2000000
    timeFrame: month
  - name: Enterprise
    scope: key
    metric: varies
    limit: custom (contact sales)
policies:
  - name: All requests count
    description: All API requests count toward the per-minute and monthly limits, including responses
      with non-2xx status codes.
  - name: Backoff
    description: On 429, reduce request rate or upgrade tier for higher ceilings.
  - name: Demo vs Pro hosts
    description: Demo plans use api.coingecko.com; Pro plans use pro-api.coingecko.com with x-cg-pro-api-key
      header.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
