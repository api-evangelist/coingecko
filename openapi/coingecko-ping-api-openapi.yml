openapi: 3.2.0
info:
  title: CoinGecko Pro Ping API
  version: 3.0.0
servers:
- url: https://pro-api.coingecko.com/api/v3
security:
- headerAuth: []
- queryAuth: []
tags:
- name: Ping
paths:
  /ping:
    get:
      summary: API Server Status
      description: To check the API server status
      operationId: ping-server
      x-mint:
        href: /reference/ping-server
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingServer'
              example:
                gecko_says: (V3) To the Moon!
      tags:
      - Ping
components:
  schemas:
    PingServer:
      type: object
      required:
      - gecko_says
      properties:
        gecko_says:
          type: string
          description: API server status message
  securitySchemes:
    headerAuth:
      type: apiKey
      in: header
      name: x-cg-pro-api-key
      description: Learn how to [set up your API key](https://docs.coingecko.com/docs/setting-up-your-api-key)
    queryAuth:
      type: apiKey
      in: query
      name: x_cg_pro_api_key
      description: Learn how to [set up your API key](https://docs.coingecko.com/docs/setting-up-your-api-key)
