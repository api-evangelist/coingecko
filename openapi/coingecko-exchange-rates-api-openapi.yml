components:
  schemas:
    ExchangeRates:
      type: object
      required:
      - rates
      properties:
        rates:
          type: object
          description: Exchange rates keyed by currency code
          additionalProperties:
            type: object
            required:
            - name
            - unit
            - value
            - type
            properties:
              name:
                type: string
                description: Currency name
              unit:
                type: string
                description: Currency unit symbol
              value:
                type: number
                description: Exchange rate value relative to BTC
              type:
                type: string
                description: 'Currency type: crypto, fiat, or commodity'
  securitySchemes:
    headerAuth:
      type: apiKey
      in: header
      name: x-cg-pro-api-key
      description: Learn how to [set up your API key](https://docs.coingecko.com/docs/setting-up-your-api-key)
    queryAuth:
      type: apiKey
      in: query
      name: x_cg_pro_api_key
      description: Learn how to [set up your API key](https://docs.coingecko.com/docs/setting-up-your-api-key)
x-provenance:
  method: harvested
