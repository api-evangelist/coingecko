      operationId: networks-list
      x-mint:
        href: /reference/networks-list
      parameters:
      - name: page
        in: query
        required: false
        description: "Page through results. \nDefault value: 1"
        schema:
          type: integer
      responses:
        '200':
          description: List of supported networks
          content:
