  /onchain/simple/token_price/multi:
    get:
      summary: Token Price by Token Addresses across Networks
      description: To get token prices based on the provided token contract addresses across multiple networks in a single request
      operationId: onchain-simple-price-multi
      x-mint:
        href: /reference/onchain-simple-price-multi
      parameters:
      - name: tokens
        in: query
        required: true
        description: "Network ID and token contract address pairs in `network_id:token_address` format, comma-separated if more than one. \nMaximum: 50 \n*refers to [`/onchain/networks`](/reference/networks-list)."
        schema:
          type: string
          default: eth:0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2,solana:6NwarBvDkXhByqVp2Qkq5i9XbtA2B3Bwe8SWGu9vpump
      - name: include_market_cap
        in: query
        required: false
        description: "Include market capitalization. \nDefault: `false`"
        schema:
          type: boolean
      - name: mcap_fdv_fallback
        in: query
        required: false
        description: "Return FDV if market cap is not available. \nDefault: `false`"
        schema:
          type: boolean
      - name: include_24hr_vol
        in: query
        required: false
        description: "Include 24hr volume. \nDefault: `false`"
        schema:
          type: boolean
      - name: include_24hr_price_change
        in: query
        required: false
        description: "Include 24hr price change. \nDefault: `false`"
        schema:
          type: boolean
      - name: include_total_reserve_in_usd
        in: query
        required: false
        description: "Include total reserve in USD. \nDefault: `false`"
        schema:
          type: boolean
      - name: include_inactive_source
        in: query
        required: false
        description: "Include token price data from inactive pools using the most recent swap. \nDefault: `false`"
