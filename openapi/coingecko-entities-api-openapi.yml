openapi: 3.2.0
info:
  title: CoinGecko Pro Entities API
  version: 3.0.0
servers:
- url: https://pro-api.coingecko.com/api/v3
security:
- headerAuth: []
- queryAuth: []
tags:
- name: Entities
paths:
  /entities/list:
    get:
      summary: Entities List
      description: To query all the supported entities on CoinGecko with entity ID, name, symbol, and country
      operationId: entities-list
      x-mint:
        href: /reference/entities-list
      parameters:
      - name: entity_type
        in: query
        required: false
        description: Filter by entity type.
        schema:
          type: string
          enum:
          - company
          - government
      - name: per_page
        in: query
        required: false
        description: "Total results per page. \nDefault value: 100 \nValid values: 1...250"
        schema:
          type: integer
      - name: page
        in: query
        required: false
        description: "Page through results. \nDefault value: 1"
        schema:
          type: integer
      responses:
        '200':
          description: List of entities with ID, name, symbol, and country
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitiesList'
              example:
              - id: texas
                symbol: ''
                name: Texas
                country: US
              - id: digipowerx
                symbol: DGX.V
                name: DigiPowerX
                country: US
      tags:
      - Entities
components:
  schemas:
    EntitiesList:
      type: array
      items:
        type: object
        required:
        - id
        - symbol
        - name
        - country
        properties:
          id:
            type: string
            description: Entity ID
          symbol:
            type: string
            description: Ticker symbol of public company
          name:
            type: string
            description: Entity name
          country:
            type: string
            description: Country code
  securitySchemes:
    headerAuth:
      type: apiKey
      in: header
      name: x-cg-pro-api-key
      description: Learn how to [set up your API key](https://docs.coingecko.com/docs/setting-up-your-api-key)
    queryAuth:
      type: apiKey
      in: query
      name: x_cg_pro_api_key
      description: Learn how to [set up your API key](https://docs.coingecko.com/docs/setting-up-your-api-key)
x-provenance:
  method: harvested
  publisher: CoinGecko
  source: https://docs.coingecko.com/openapi-specs/pro-api.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
