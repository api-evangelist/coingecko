      tags:
      - Exchanges
  /exchanges/{id}/volume_chart:
    get:
      summary: Exchange Volume Chart by ID
      description: To query the historical volume chart data with time in UNIX and trading volume data in BTC based on exchange's ID
      operationId: exchanges-id-volume-chart
      x-mint:
        href: /reference/exchanges-id-volume-chart
      parameters:
      - name: id
        in: path
        required: true
        description: "Exchange ID or derivative exchange ID. \n*refers to [`/exchanges/list`](/reference/exchanges-list) or [`/derivatives/exchanges/list`](/reference/derivatives-exchanges-list)."
        schema:
          type: string
          default: binance
      - name: days
        in: query
        required: true
        description: Data up to number of days ago.
        schema:
          type: string
          default: '1'
          enum:
          - '1'
          - '7'
          - '14'
          - '30'
          - '90'
          - '180'
          - '365'
      responses:
        '200':
          description: Exchange volume chart data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeVolumeChart'
              example:
              - - 1779719400000
                - '76327.6889417086372104'
              - - 1779720000000
                - '76335.761747668369059'
      tags:
      - Exchanges
  /exchanges/{id}/volume_chart/range:
    get:
      summary: Exchange Volume Chart within Time Range by ID
      description: To query the historical volume chart data in BTC by specifying date range in UNIX based on exchange's ID
      operationId: exchanges-id-volume-chart-range
      x-mint:
        href: /reference/exchanges-id-volume-chart-range
      parameters:
      - name: id
        in: path
        required: true
        description: "Exchange ID or derivative exchange ID. \n*refers to [`/exchanges/list`](/reference/exchanges-list) or [`/derivatives/exchanges/list`](/reference/derivatives-exchanges-list)."
        schema:
          type: string
          default: binance
      - name: from
        in: query
        required: true
        description: Starting date in UNIX timestamp.
        schema:
          type: number
          default: '1767196800'
      - name: to
        in: query
        required: true
        description: Ending date in UNIX timestamp.
        schema:
          type: number
          default: '1769702400'
      responses:
        '200':
          description: Exchange volume chart data within time range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeVolumeChart'
              example:
              - - 1767282600000.0
                - '100719.0303690094832477'
              - - 1767369000000.0
                - '132387.93566259711126'
      tags:
      - Exchanges
components:
  schemas:
    CoinsIdTickers:
      type: object
      required:
      - name
      - tickers
      properties:
        name:
          type: string
          description: Coin name
        tickers:
          type: array
          description: List of tickers
          items:
            type: object
            required:
            - base
            - target
            - market
            - last
            - volume
            - converted_last
            - converted_volume
            - trust_score
            - bid_ask_spread_percentage
            - timestamp
            - last_traded_at
            - last_fetch_at
            - is_anomaly
            - is_stale
            - trade_url
            - token_info_url
            - coin_id
            - target_coin_id
            - coin_mcap_usd
            properties:
              base:
                type: string
                description: Ticker base currency
              target:
                type: string
                description: Ticker target currency
              market:
                type: object
                description: Exchange information
                properties:
                  name:
                    type: string
                    description: Exchange name
                  identifier:
                    type: string
                    description: Exchange identifier
                  has_trading_incentive:
                    type: boolean
                    description: Exchange trading incentive
                  logo:
                    type: string
                    description: Exchange logo URL
              last:
                type: number
                description: Last price
              volume:
                type: number
                description: Trading volume
              cost_to_move_up_usd:
                type: number
                description: Cost to move price up by 2% in USD
              cost_to_move_down_usd:
                type: number
                description: Cost to move price down by 2% in USD
              converted_last:
                type: object
                description: Converted last price
                properties:
                  btc:
                    type: number
                  eth:
                    type: number
                  usd:
                    type: number
              converted_volume:
                type: object
                description: Converted trading volume
                properties:
                  btc:
                    type: number
                  eth:
                    type: number
                  usd:
                    type: number
              trust_score:
                type:
                - string
                - 'null'
                description: Trust score
              bid_ask_spread_percentage:
                type: number
                description: Bid-ask spread percentage
              timestamp:
                type: string
                description: Ticker timestamp
              last_traded_at:
                type: string
                description: Last traded timestamp
              last_fetch_at:
                type: string
                description: Last fetch timestamp
              is_anomaly:
                type: boolean
                description: Whether ticker is anomalous
              is_stale:
                type: boolean
                description: Whether ticker is stale
              trade_url:
                type: string
                description: Trade URL
              token_info_url:
                type:
                - string
                - 'null'
                description: Token info URL
              coin_id:
                type: string
                description: Base currency coin ID
              target_coin_id:
                type: string
                description: Target currency coin ID
              coin_mcap_usd:
                type: number
                description: Coin market cap in USD
    ExchangeVolumeChart:
      type: array
      description: Volume chart data points as [timestamp, volume_in_btc] pairs
      items:
        type: array
        items:
          oneOf:
          - type: number
          - type: string
    ExchangesId:
      type: object
      required:
      - name
      - year_established
      - country
      - description
      - url
      - image
      - facebook_url
      - reddit_url
      - telegram_url
      - slack_url
      - other_url_1
      - other_url_2
      - twitter_handle
      - has_trading_incentive
      - centralized
      - public_notice
      - alert_notice
      - trust_score
      - trust_score_rank
      - coins
      - pairs
      - trade_volume_24h_btc
      - tickers
      - status_updates
      properties:
        name:
          type: string
          description: Exchange name
        year_established:
          type:
          - number
          - 'null'
          description: Year the exchange was established
        country:
          type:
          - string
          - 'null'
          description: Country where the exchange is based
        description:
          type: string
          description: Exchange description
        url:
          type: string
          description: Exchange website URL
        image:
          type: string
          description: Exchange logo URL
        facebook_url:
          type: string
          description: Facebook URL
        reddit_url:
          type: string
          description: Reddit URL
        telegram_url:
          type: string
          description: Telegram URL
        slack_url:
          type: string
          description: Slack URL
        other_url_1:
          type: string
          description: Other URL 1
        other_url_2:
          type: string
          description: Other URL 2
        twitter_handle:
          type: string
          description: Twitter handle
        has_trading_incentive:
          type: boolean
          description: Whether the exchange has trading incentive
        centralized:
          type: boolean
          description: Whether the exchange is centralized
        public_notice:
          type: string
          description: Public notice
        alert_notice:
          type: string
          description: Alert notice
        trust_score:
          type:
          - number
          - 'null'
          description: Exchange trust score
        trust_score_rank:
          type:
          - number
          - 'null'
          description: Exchange trust score rank
        coins:
          type: number
          description: Number of coins listed
        pairs:
          type: number
          description: Number of trading pairs
        trade_volume_24h_btc:
          type: number
          description: Exchange 24h trading volume in BTC
        tickers:
          type: array
          description: Exchange tickers
          items:
            type: object
            properties:
              base:
                type: string
                description: Ticker base currency
              target:
                type: string
                description: Ticker target currency
              market:
                type: object
                description: Exchange information
                properties:
                  name:
                    type: string
                    description: Exchange name
                  identifier:
                    type: string
                    description: Exchange identifier
                  has_trading_incentive:
                    type: boolean
                    description: Exchange trading incentive
              last:
                type: number
                description: Last price
              volume:
                type: number
                description: Trading volume
              converted_last:
                type: object
                description: Converted last price
                properties:
                  btc:
                    type: number
                  eth:
                    type: number
                  usd:
                    type: number
              converted_volume:
                type: object
                description: Converted trading volume
                properties:
                  btc:
                    type: number
                  eth:
                    type: number
                  usd:
                    type: number
              trust_score:
                type:
                - string
                - 'null'
                description: Trust score
              bid_ask_spread_percentage:
                type: number
                description: Bid-ask spread percentage
              timestamp:
                type: string
                description: Ticker timestamp
              last_traded_at:
                type: string
                description: Last traded timestamp
              last_fetch_at:
                type: string
                description: Last fetch timestamp
              is_anomaly:
                type: boolean
                description: Whether ticker is anomalous
              is_stale:
                type: boolean
                description: Whether ticker is stale
              trade_url:
                type: string
                description: Trade URL
              token_info_url:
                type:
                - string
                - 'null'
                description: Token info URL
              coin_id:
                type: string
                description: Base currency coin ID
              target_coin_id:
                type: string
                description: Target currency coin ID
              coin_mcap_usd:
                type: number
                description: Coin market cap in USD
        status_updates:
          type: array
          description: Status updates
          items:
            type: object
            properties:
              description:
                type: string
                description: Status update description
              category:
                type: string
                description: Status update category
              created_at:
                type: string
                description: Status update creation time
              user:
                type: string
                description: Status update user
              user_title:
                type: string
                description: Status update user title
              pin:
                type: boolean
                description: Whether status update is pinned
              project:
                type: object
                description: Project information
                properties:
                  type:
                    type: string
                    description: Project type
                  id:
                    type: string
                    description: Project ID
                  name:
                    type: string
                    description: Project name
                  image:
                    type: object
                    description: Project image URLs
                    properties:
                      thumb:
                        type: string
                      small:
                        type: string
                      large:
                        type: string
    Exchanges:
      type: array
      items:
        type: object
        required:
        - id
        - name
        - year_established
        - country
        - description
        - url
        - image
        - has_trading_incentive
        - trust_score
        - trust_score_rank
        - trade_volume_24h_btc
        properties:
          id:
            type: string
            description: Exchange ID
          name:
            type: string
            description: Exchange name
          year_established:
            type:
            - number
            - 'null'
            description: Year the exchange was established
          country:
            type:
            - string
            - 'null'
            description: Country where the exchange is based
          description:
            type: string
            description: Exchange description
          url:
            type: string
            description: Exchange website URL
          image:
            type: string
            description: Exchange logo URL
          has_trading_incentive:
            type: boolean
            description: Whether the exchange has trading incentive
          trust_score:
            type:
            - number
            - 'null'
            description: Exchange trust score
          trust_score_rank:
            type:
            - number
            - 'null'
            description: Exchange trust score rank
          trade_volume_24h_btc:
            type: number
            description: Exchange 24h trading volume in BTC
    ExchangesList:
      type: array
      items:
        type: object
        required:
        - id
        - name
        properties:
          id:
            type: string
            description: Exchange ID
          name:
            type: string
            description: Exchange name
  securitySchemes:
    headerAuth:
      type: apiKey
      in: header
      name: x-cg-pro-api-key
      description: Learn how to [set up your API key](https://docs.coingecko.com/docs/setting-up-your-api-key)
    queryAuth:
      type: apiKey
      in: query
      name: x_cg_pro_api_key
      description: Learn how to [set up your API key](https://docs.coingecko.com/docs/setting-up-your-api-key)
x-provenance:
  method: harvested
  publisher: CoinGecko
  source: https://docs.coingecko.com/openapi-specs/pro-api.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
