components:
  schemas:
    RwasIdMarketChart:
      type: object
      required:
      - tokenized_prices
      - tokenized_market_caps
      - tokenized_total_volumes
      properties:
        tokenized_prices:
          type: array
          description: Tokenized price data points as [timestamp, price] pairs
          items:
            type: array
            items:
              type: number
        tokenized_market_caps:
          type: array
          description: Tokenized market cap data points as [timestamp, market_cap] pairs
          items:
            type: array
            items:
              type: number
        tokenized_total_volumes:
          type: array
          description: Tokenized total volume data points as [timestamp, volume] pairs
          items:
            type: array
            items:
              type: number
    RwasMarkets:
      type: array
      items:
        type: object
        required:
        - id
        - symbol
        - name
        - asset_type
        - image
        - tokenized_market_data
        properties:
          id:
            type: string
            description: RWA ID
          symbol:
            type: string
            description: RWA symbol
          name:
            type: string
            description: RWA name
          asset_type:
            type: string
            enum:
            - stock
            - commodity
            - etf
            description: RWA asset type
          image:
            type: string
            description: Large image URL of the token with the largest market cap
          tokenized_market_data:
            type: object
            description: Aggregated tokenized market data
            properties:
              current_price:
                type:
                - number
                - 'null'
                description: Current price in target currency
              market_cap:
                type:
                - number
                - 'null'
                description: Market cap in target currency
              total_volume:
                type:
                - number
                - 'null'
                description: Total trading volume in target currency
              high_24h:
                type:
                - number
                - 'null'
                description: 24-hour price high in target currency
              low_24h:
                type:
                - number
                - 'null'
                description: 24-hour price low in target currency
              price_change_24h:
                type:
                - number
                - 'null'
                description: 24-hour price change in target currency
              price_change_percentage_24h:
                type:
                - number
                - 'null'
                description: 24-hour price change percentage
              market_cap_change_24h:
                type:
                - number
                - 'null'
                description: 24-hour market cap change in target currency
              market_cap_change_percentage_24h:
                type:
                - number
                - 'null'
                description: 24-hour market cap change percentage
              last_updated:
                type: string
                format: date-time
                description: Last updated timestamp
              sparkline_in_7d:
                type: object
                description: Sparkline price data for the last 7 days
                properties:
                  price:
                    type: array
                    description: Array of price values
                    items:
                      type: number
              price_change_percentage_1h_in_currency:
                type:
                - number
                - 'null'
                description: 1-hour price change percentage in target currency
              price_change_percentage_24h_in_currency:
                type:
                - number
                - 'null'
                description: 24-hour price change percentage in target currency
              price_change_percentage_7d_in_currency:
                type:
                - number
                - 'null'
                description: 7-day price change percentage in target currency
              price_change_percentage_14d_in_currency:
                type:
                - number
                - 'null'
                description: 14-day price change percentage in target currency
              price_change_percentage_30d_in_currency:
                type:
                - number
                - 'null'
                description: 30-day price change percentage in target currency
              price_change_percentage_200d_in_currency:
                type:
                - number
                - 'null'
                description: 200-day price change percentage in target currency
              price_change_percentage_1y_in_currency:
                type:
                - number
                - 'null'
                description: 1-year price change percentage in target currency
    RwasIdTickers:
      type: object
      required:
      - name
      - tickers
      properties:
        name:
          type: string
          description: RWA name
        tickers:
          type: array
          description: List of tickers
          items:
            type: object
            required:
            - base
            - target
            - market
            - last
            - volume
            - converted_last
            - converted_volume
            - bid_ask_spread_percentage
            - timestamp
            - last_traded_at
            - last_fetch_at
            - is_anomaly
            - is_stale
            - trade_url
            - token_info_url
            - coin_id
            - coin_mcap_usd
            properties:
              base:
                type: string
                description: Ticker base currency
              target:
                type: string
                description: Ticker target currency
              market:
                type: object
                description: Exchange information
                properties:
                  name:
                    type: string
                    description: Exchange name
                  identifier:
                    type: string
                    description: Exchange identifier
                  has_trading_incentive:
