      - Rwas
  /rwas/{id}:
    get:
      summary: RWA Data by ID
      description: To query all the metadata, market data and tokens of a RWA based on a particular RWA ID
      operationId: rwas-id
      x-mint:
        href: /reference/rwas-id
      parameters:
      - name: id
        in: path
        required: true
        description: "RWA ID. \n*refers to [`/rwas/list`](/reference/rwas-list)"
        schema:
          type: string
          default: gold
      - name: sparkline
        in: query
        required: false
        description: "Include sparkline 7-day data. \nDefault: false"
        schema:
          type: boolean
      - name: tokens
        in: query
        required: false
        description: "Include tokens data. \nDefault: false"
        schema:
          type: boolean
      - name: tokenized_market_data
        in: query
        required: false
        description: "Include tokenized market data. \nDefault: false"
        schema:
          type: boolean
      - name: perps_market_data
        in: query
        required: false
        description: "Include perpetuals market data. \nDefault: false"
        schema:
          type: boolean
      responses:
        '200':
          description: RWA data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RwasID'
              example:
                id: gold
                symbol: xau
                name: Gold
                asset_type: commodity
