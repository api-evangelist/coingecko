  /rwas/{id}/tickers:
    get:
      summary: RWA Tickers by ID
      description: To query the RWA tokens tickers on both centralized exchange (CEX) and decentralized exchange (DEX) based on a particular RWA ID
      operationId: rwas-id-tickers
      x-mint:
        href: /reference/rwas-id-tickers
      parameters:
      - name: id
        in: path
        required: true
        description: "RWA ID. \n*refers to [`/rwas/list`](/reference/rwas-list)"
        schema:
          type: string
          default: gold
      - name: issuer_ids
        in: query
        required: false
        description: "Issuer ID. \n*refers to [`/rwas/issuers/list`](/reference/rwas-issuers-list)"
        schema:
          type: string
      - name: exchange_ids
        in: query
        required: false
        description: "Exchange ID. \n*refers to [`/exchanges/list`](/reference/exchanges-list)"
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page through results
        schema:
          type: integer
      - name: order
        in: query
        required: false
        description: "Sort the order of responses. \nDefault: last_traded_at_desc"
        schema:
          type: string
          enum:
          - last_traded_at_desc
          - last_traded_at_asc
          - volume_desc
          - volume_asc
      - name: depth
        in: query
        required: false
        description: "Include 2% orderbook depth, i.e. `cost_to_move_up_usd` and `cost_to_move_down_usd`. \nDefault: false"
        schema:
          type: boolean
      - name: dex_pair_format
        in: query
        required: false
        description: "Set to `symbol` to display DEX pair base and target as symbols. \nDefault: `contract_address`"
        schema:
          type: string
          enum:
          - contract_address
          - symbol
      responses:
