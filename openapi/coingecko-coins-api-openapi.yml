components:
  schemas:
    CoinsOHLC:
      type: array
      description: OHLC data points as [timestamp, open, high, low, close] arrays
      items:
        type: array
        items:
          type: number
    CategoriesList:
      type: array
      items:
        type: object
        required:
        - category_id
        - name
        properties:
          category_id:
            type: string
            description: Category ID
          name:
            type: string
            description: Category name
    Categories:
      type: array
      items:
        type: object
        required:
        - id
        - name
        - market_cap
        - market_cap_change_24h
        - content
        - top_3_coins_id
        - top_3_coins
        - volume_24h
        - updated_at
        properties:
          id:
            type: string
            description: Category ID
          name:
            type: string
            description: Category name
          market_cap:
            type: number
            description: Category market cap
          market_cap_change_24h:
            type: number
            description: Category market cap change in 24 hours
          content:
            type: string
            description: Category description
          top_3_coins_id:
            type: array
            description: IDs of top 3 coins in the category
            items:
              type: string
          top_3_coins:
            type: array
            description: Image URLs of top 3 coins in the category
            items:
              type: string
          volume_24h:
            type: number
            description: Category trading volume in 24 hours
          updated_at:
            type: string
            description: Category last updated timestamp
    TotalSupplyChart:
      type: object
      required:
      - total_supply
      properties:
        total_supply:
          type: array
          description: Total supply data points as [timestamp, supply] pairs
          items:
            type: array
            items:
              oneOf:
              - type: number
              - type: string
    CoinsContractAddress:
      type: object
      required:
      - id
      - symbol
      - name
      - web_slug
      - asset_platform_id
      - platforms
      - detail_platforms
      - block_time_in_minutes
      - hashing_algorithm
      - categories
      - preview_listing
      - public_notice
      - additional_notices
      - has_supply_breakdown
      - description
      - links
      - image
      - country_origin
      - genesis_date
      - contract_address
      - sentiment_votes_up_percentage
      - sentiment_votes_down_percentage
      - watchlist_portfolio_users
      - market_cap_rank
      - market_cap_rank_with_rehypothecated
      - status_updates
      - last_updated
      properties:
        id:
          type: string
          description: Coin ID
        symbol:
          type: string
          description: Coin symbol
        name:
          type: string
          description: Coin name
        web_slug:
          type: string
          description: Coin web slug
        asset_platform_id:
          type:
          - string
          - 'null'
          description: Coin asset platform ID
        platforms:
          type: object
          description: Coin asset platform and contract address
          additionalProperties:
            type: string
        detail_platforms:
          type: object
          description: Detailed coin asset platform and contract address
          additionalProperties:
            type: object
            properties:
              decimal_place:
                type:
                - integer
                - 'null'
                description: Token decimal place
              contract_address:
                type: string
                description: Token contract address
              geckoterminal_url:
                type: string
                description: GeckoTerminal URL
        block_time_in_minutes:
          type: number
          description: Blockchain block time in minutes
        hashing_algorithm:
          type:
          - string
          - 'null'
          description: Blockchain hashing algorithm
        categories:
          type: array
          description: Coin categories
          items:
            type: string
        preview_listing:
          type: boolean
          description: Preview listing coin
        public_notice:
          type:
          - string
          - 'null'
          description: Public notice
        additional_notices:
          type: array
          description: Additional notices
          items:
            type: string
        has_supply_breakdown:
          type: boolean
          description: Whether detailed supply breakdown data is available via /coins/supply_breakdown
        localization:
          type: object
          description: Coin name localization
          additionalProperties:
            type: string
        description:
          type: object
          description: Coin description
          additionalProperties:
            type: string
        links:
          type: object
          description: Links
          properties:
            homepage:
              type: array
              description: Website URL
              items:
                type: string
            whitepaper:
              type: string
              description: Whitepaper URL
            blockchain_site:
              type: array
              description: Block explorer URL
              items:
                type: string
            official_forum_url:
              type: array
              description: Official forum URL
              items:
                type: string
