specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: CoinGecko
providerId: coingecko
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - Cryptocurrency
  - Market Data
description: 'FOCUS-aligned FinOps for CoinGecko: subscription tiers with monthly call-credit allotments
  plus per-500K-call overage at $250.'
sources:
  - https://www.coingecko.com/en/api/pricing
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Gecko Labs Pte. Ltd.
serviceCategory: Market Data
billingModel:
  pricingCategory: Tiered Subscription + Overage
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Adjustment
    - Refund
focusColumns:
  ServiceName: CoinGecko API
  ServiceCategory: Market Data
  ProviderName: CoinGecko
  PublisherName: Gecko Labs Pte. Ltd.
  InvoiceIssuerName: Gecko Labs Pte. Ltd.
  BillingCurrency: USD
meters:
  - name: api_credits_consumed
    unit: request
    aggregation: sum
    dimensions:
      - plan
      - endpoint
      - status_code
  - name: subscription_fee
    unit: month
    aggregation: sum
    dimensions:
      - plan
      - billing_cycle
  - name: overage_credits
    unit: request
    aggregation: sum
    dimensions:
      - plan
principles:
  - name: Visibility
    description: Track per-key consumption against monthly credits using the CoinGecko dashboard usage
      tab; alert at 80% of monthly allotment to avoid overage charges.
  - name: Allocation
    description: Issue separate API keys per consuming application or environment so credits and overage
      can be charged back.
  - name: Optimization
    description: Cache frequent endpoints (coins/markets, simple/price); use webhook/WebSocket Pro features
      to avoid polling; right-size plan annually given $250 / 500K-call overage versus next-tier subscription.
  - name: Accountability
    description: Engineering owns endpoint efficiency and caching; finance owns plan tier and renewal.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
