description: CoinGecko offers a tiered API subscription model with a free Demo plan and paid Pro plans
  (Basic, Analyst, Lite) plus custom Enterprise. Pricing is monthly or discounted annually; each tier
  includes a monthly call credit cap and a per-minute rate limit. Overage charged at $250 per 500K calls
  beyond the included allotment.
