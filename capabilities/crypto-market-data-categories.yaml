naftiko: 1.0.0-alpha2
info:
  label: CoinGecko Crypto Market Data API — Categories
  description: 'CoinGecko Crypto Market Data API — Categories. 2 operations. Lead operation: List categories with market data.
    Self-contained Naftiko capability covering one Coingecko business surface.'
  tags:
  - Coingecko
  - Categories
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COINGECKO_API_KEY: COINGECKO_API_KEY
capability:
  consumes:
  - type: http
    namespace: crypto-market-data-categories
    baseUri: https://api.coingecko.com/api/v3
    description: CoinGecko Crypto Market Data API — Categories business capability. Self-contained, no shared references.
    resources:
    - name: coins-categories
      path: /coins/categories
      operations:
      - name: getcoinscategories
        method: GET
        description: List categories with market data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: order
          in: query
          type: string
          description: Sort order for categories
    - name: coins-categories-list
      path: /coins/categories/list
      operations:
      - name: getcoinscategorieslist
        method: GET
        description: List all categories (ID map)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-cg-demo-api-key
      value: '{{env.COINGECKO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: crypto-market-data-categories-rest
    port: 8080
    description: REST adapter for CoinGecko Crypto Market Data API — Categories. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/coins/categories
      name: coins-categories
      description: REST surface for coins-categories.
      operations:
      - method: GET
        name: getcoinscategories
        description: List categories with market data
        call: crypto-market-data-categories.getcoinscategories
        with:
          order: rest.order
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/coins/categories/list
      name: coins-categories-list
      description: REST surface for coins-categories-list.
      operations:
      - method: GET
        name: getcoinscategorieslist
        description: List all categories (ID map)
        call: crypto-market-data-categories.getcoinscategorieslist
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: crypto-market-data-categories-mcp
    port: 9090
    transport: http
    description: MCP adapter for CoinGecko Crypto Market Data API — Categories. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-categories-market-data
      description: List categories with market data
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: crypto-market-data-categories.getcoinscategories
      with:
        order: tools.order
      outputParameters:
      - type: object
        mapping: $.
    - name: list-all-categories-id-map
      description: List all categories (ID map)
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: crypto-market-data-categories.getcoinscategorieslist
      outputParameters:
      - type: object
        mapping: $.
