naftiko: 1.0.0-alpha2
info:
  label: CoinGecko Onchain DEX API — DEXes
  description: 'CoinGecko Onchain DEX API — DEXes. 1 operations. Lead operation: List DEXes on a network. Self-contained Naftiko
    capability covering one Coingecko business surface.'
  tags:
  - Coingecko
  - DEXes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COINGECKO_API_KEY: COINGECKO_API_KEY
capability:
  consumes:
  - type: http
    namespace: onchain-dex-dexes
    baseUri: https://pro-api.coingecko.com/api/v3
    description: CoinGecko Onchain DEX API — DEXes business capability. Self-contained, no shared references.
    resources:
    - name: onchain-networks-network-dexes
      path: /onchain/networks/{network}/dexes
      operations:
      - name: getonchainnetworkdexes
        method: GET
        description: List DEXes on a network
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Page number for pagination
    authentication:
      type: apikey
      key: x-cg-pro-api-key
      value: '{{env.COINGECKO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: onchain-dex-dexes-rest
    port: 8080
    description: REST adapter for CoinGecko Onchain DEX API — DEXes. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/onchain/networks/{network}/dexes
      name: onchain-networks-network-dexes
      description: REST surface for onchain-networks-network-dexes.
      operations:
      - method: GET
        name: getonchainnetworkdexes
        description: List DEXes on a network
        call: onchain-dex-dexes.getonchainnetworkdexes
        with:
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: onchain-dex-dexes-mcp
    port: 9090
    transport: http
    description: MCP adapter for CoinGecko Onchain DEX API — DEXes. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-dexes-network
      description: List DEXes on a network
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: onchain-dex-dexes.getonchainnetworkdexes
      with:
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
