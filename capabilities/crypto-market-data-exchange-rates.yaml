naftiko: 1.0.0-alpha2
info:
  label: CoinGecko Crypto Market Data API — Exchange Rates
  description: 'CoinGecko Crypto Market Data API — Exchange Rates. 1 operations. Lead operation: Get BTC exchange rates. Self-contained
    Naftiko capability covering one Coingecko business surface.'
  tags:
  - Coingecko
  - Exchange Rates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COINGECKO_API_KEY: COINGECKO_API_KEY
capability:
  consumes:
  - type: http
    namespace: crypto-market-data-exchange-rates
    baseUri: https://api.coingecko.com/api/v3
    description: CoinGecko Crypto Market Data API — Exchange Rates business capability. Self-contained, no shared references.
    resources:
    - name: exchange_rates
      path: /exchange_rates
      operations:
      - name: getexchangerates
        method: GET
        description: Get BTC exchange rates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-cg-demo-api-key
      value: '{{env.COINGECKO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: crypto-market-data-exchange-rates-rest
    port: 8080
    description: REST adapter for CoinGecko Crypto Market Data API — Exchange Rates. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/exchange-rates
      name: exchange-rates
      description: REST surface for exchange_rates.
      operations:
      - method: GET
        name: getexchangerates
        description: Get BTC exchange rates
        call: crypto-market-data-exchange-rates.getexchangerates
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: crypto-market-data-exchange-rates-mcp
    port: 9090
    transport: http
    description: MCP adapter for CoinGecko Crypto Market Data API — Exchange Rates. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-btc-exchange-rates
      description: Get BTC exchange rates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: crypto-market-data-exchange-rates.getexchangerates
      outputParameters:
      - type: object
        mapping: $.
