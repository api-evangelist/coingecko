naftiko: 1.0.0-alpha2
info:
  label: CoinGecko Crypto Market Data API — Asset Platforms
  description: 'CoinGecko Crypto Market Data API — Asset Platforms. 1 operations. Lead operation: List asset platforms. Self-contained
    Naftiko capability covering one Coingecko business surface.'
  tags:
  - Coingecko
  - Asset Platforms
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COINGECKO_API_KEY: COINGECKO_API_KEY
capability:
  consumes:
  - type: http
    namespace: crypto-market-data-asset-platforms
    baseUri: https://api.coingecko.com/api/v3
    description: CoinGecko Crypto Market Data API — Asset Platforms business capability. Self-contained, no shared references.
    resources:
    - name: asset_platforms
      path: /asset_platforms
      operations:
      - name: getassetplatforms
        method: GET
        description: List asset platforms
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: string
          description: Filter by platform type (e.g., nft to get NFT-supported platforms)
    authentication:
      type: apikey
      key: x-cg-demo-api-key
      value: '{{env.COINGECKO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: crypto-market-data-asset-platforms-rest
    port: 8080
    description: REST adapter for CoinGecko Crypto Market Data API — Asset Platforms. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/asset-platforms
      name: asset-platforms
      description: REST surface for asset_platforms.
      operations:
      - method: GET
        name: getassetplatforms
        description: List asset platforms
        call: crypto-market-data-asset-platforms.getassetplatforms
        with:
          filter: rest.filter
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: crypto-market-data-asset-platforms-mcp
    port: 9090
    transport: http
    description: MCP adapter for CoinGecko Crypto Market Data API — Asset Platforms. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-asset-platforms
      description: List asset platforms
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: crypto-market-data-asset-platforms.getassetplatforms
      with:
        filter: tools.filter
      outputParameters:
      - type: object
        mapping: $.
