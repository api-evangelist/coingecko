naftiko: 1.0.0-alpha2
info:
  label: CoinGecko Onchain DEX API — Search
  description: 'CoinGecko Onchain DEX API — Search. 1 operations. Lead operation: Search for pools. Self-contained Naftiko
    capability covering one Coingecko business surface.'
  tags:
  - Coingecko
  - Search
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COINGECKO_API_KEY: COINGECKO_API_KEY
capability:
  consumes:
  - type: http
    namespace: onchain-dex-search
    baseUri: https://pro-api.coingecko.com/api/v3
    description: CoinGecko Onchain DEX API — Search business capability. Self-contained, no shared references.
    resources:
    - name: onchain-search-pools
      path: /onchain/search/pools
      operations:
      - name: searchonchainpools
        method: GET
        description: Search for pools
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query
          in: query
          type: string
          description: Search query (token name, symbol, token address, or pool address)
          required: true
        - name: network
          in: query
          type: string
          description: Filter results by network ID
        - name: include
          in: query
          type: string
          description: Additional data to include (e.g., base_token, quote_token, dex, network)
        - name: page
          in: query
          type: integer
          description: Page number for pagination
    authentication:
      type: apikey
      key: x-cg-pro-api-key
      value: '{{env.COINGECKO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: onchain-dex-search-rest
    port: 8080
    description: REST adapter for CoinGecko Onchain DEX API — Search. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/onchain/search/pools
      name: onchain-search-pools
      description: REST surface for onchain-search-pools.
      operations:
      - method: GET
        name: searchonchainpools
        description: Search for pools
        call: onchain-dex-search.searchonchainpools
        with:
          query: rest.query
          network: rest.network
          include: rest.include
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: onchain-dex-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for CoinGecko Onchain DEX API — Search. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: search-pools
      description: Search for pools
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: onchain-dex-search.searchonchainpools
      with:
        query: tools.query
        network: tools.network
        include: tools.include
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
